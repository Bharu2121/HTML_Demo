<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="tip_calcualtor">Tip Calculator</h1>
        <p class="info">Enter the bill amount and tip percentage to calculate the total.</p>
        <label for="amount">Bill amount:</label>
        <br>
        <input type="text" name="amount" id="amount">
        <br>
        <label for="percentage">Tip Percentage:</label>
        <br>
        <input type="text" name="per" id="percentage">
        <br>
        <button type="button" id="calculate_btn">Calculate</button>
        <br>
        <label >Total:</label>
        <span id="total"></span>   
    </div>
    <script src="index.js"></script>
</body>
</html>
