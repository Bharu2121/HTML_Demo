<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="currency-converter.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Currency Converter</h1>
        <div class="currency_lookup">
            <select id="source_currency">
                <option value="AUD">AUD</option>
                <option value="CAD">CAD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="INR">INR</option>
                <option value="JPY">JPY</option>
                <option value="USD" selected>USD</option>
            </select>
            <input type="number" value="1" id="src_pick" min="0">
        </div>
        <div class="currency_lookup">
            <select id="destination_currency">
                <option value="AUD">AUD</option>
                <option value="CAD">CAD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="INR" selected>INR</option>
                <option value="JPY">JPY</option>
                <option value="USD">USD</option>
            </select>
            <input type="number" id="dest_value" disabled>
        </div>
        <p class="currency_converter" id="exchange-rate">1 USD = 138.5802 JPY</p>
    </div>
    <script src="currency-converter.js"></script>
</body>
</html>
